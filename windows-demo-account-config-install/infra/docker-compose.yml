name: hybrid-phase0
services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: hybrid
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d hybrid"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: "no"
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"]
    environment:
      TRADING_MODE: PAPER
      LIVE_TRADING_ENABLED: "false"
      APP_CONFIG_FILE: configs/paper.example.yaml
      DATABASE_URL: postgresql+psycopg://dev:dev@db:5432/hybrid
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - demo_export_data:/app/demo-export-state
      - type: volume
        source: demo_key_session_ram
        target: /run/demo-keys
        volume: {nocopy: true}
    depends_on:
      db: {condition: service_healthy}
      key-session: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: "no"
  key-session:
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    command: ["python", "-c", "import signal; signal.pause()"]
    user: "10001:10001"
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 16
    healthcheck:
      test: ["CMD", "python", "-c", "import os,stat; s=os.stat('/run/demo-keys'); assert stat.S_ISDIR(s.st_mode) and stat.S_IMODE(s.st_mode)==0o700 and s.st_uid==10001"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - type: volume
        source: demo_key_session_ram
        target: /run/demo-keys
        read_only: true
        volume: {nocopy: true}
    restart: "no"
  alerts:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    command: ["python", "-m", "scripts.watch_demo_alert_email"]
    environment:
      TRADING_MODE: PAPER
      LIVE_TRADING_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://dev:dev@db:5432/hybrid
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1048576,mode=0700,uid=10001,gid=10001
    volumes:
      - type: volume
        source: demo_key_session_ram
        target: /run/demo-keys
        read_only: true
        volume: {nocopy: true}
    depends_on:
      api: {condition: service_healthy}
      db: {condition: service_healthy}
      key-session: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; age=time.monotonic()-float(Path('/tmp/demo-alert-watch-health').read_text()); assert 0 <= age < 30"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"
  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: "no"
volumes:
  postgres_data:
  demo_export_data:
  demo_key_session_ram:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=65536,mode=0700,uid=10001,gid=10001,noexec,nosuid,nodev"
